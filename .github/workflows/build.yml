name: Build and test (Windows and Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds of the same branch run one at a time, in order, so an older build
# can never finish last and be marked as the newest release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so we can count commits for the version number

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Version = 1.0.<number of commits on this branch>. It goes up by one with every merge to main.
      - name: Work out the version number
        shell: bash
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Run tests (including the Windows-only ones)
        run: dotnet test PCDoctor.sln --configuration Release --logger "console;verbosity=normal"

      - name: Build PCDoctor.exe
        run: >
          dotnet publish src/PCDoctor.App/PCDoctor.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          --output publish

      - name: Upload PCDoctor.exe
        uses: actions/upload-artifact@v4
        with:
          name: PCDoctor-win-x64
          path: publish/PCDoctor.exe

  # The Linux / Steam Deck version: one file that runs from the home folder without installing anything.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version number
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Run tests (including the Linux-only ones)
        run: dotnet test PCDoctor.sln --configuration Release --logger "console;verbosity=normal"

      - name: Build PCDoctor-linux-x64
        run: |
          dotnet publish src/PCDoctor.App/PCDoctor.App.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ env.VERSION }} \
            --output publish
          mv publish/PCDoctor publish/PCDoctor-linux-x64
          chmod +x publish/PCDoctor-linux-x64

      - name: Check that it starts (on a pretend screen)
        run: |
          sudo apt-get install -y xvfb > /dev/null
          export HOME="$(mktemp -d)"
          xvfb-run -a -s "-screen 0 1280x800x24" timeout 20s publish/PCDoctor-linux-x64 > start.log 2>&1 || code=$?
          cat start.log
          # 124 = still running when the 20 seconds were up, which is what we want.
          if [ "${code:-0}" != "124" ]; then echo "PC Doctor stopped by itself (exit code ${code:-0})"; exit 1; fi

      - name: Upload PCDoctor-linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: PCDoctor-linux-x64
          path: publish/PCDoctor-linux-x64

  # Only on main: put both files under the repository's "Releases" page.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish a GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version number
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" files/PCDoctor.exe files/PCDoctor-linux-x64
          --target "$GITHUB_SHA"
          --title "PC Doctor $VERSION"
          --generate-notes
          --latest
